<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TVL Bucket Summary</title>
    <script src="https://code.highcharts.com/highcharts.js"></script>
    <script src="https://code.highcharts.com/modules/exporting.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
            background-color: #f5f5f5;
        }
        #chart-container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        #chart { width: 100%; height: 500px; }
    </style>
</head>
<body>
    <div id="chart-container">
        <div id="chart"></div>
    </div>

    <script>
        const rawData = [
  {
    "bucket": "<$400M",
    "n": 62068,
    "pct": 62.1,
    "median_tvl": 271.0,
    "p10_tvl": 163.0,
    "p90_tvl": 371.0
  },
  {
    "bucket": "$400-500M",
    "n": 15597,
    "pct": 15.6,
    "median_tvl": 444.0,
    "p10_tvl": 408.0,
    "p90_tvl": 487.0
  },
  {
    "bucket": "$500-750M",
    "n": 16917,
    "pct": 16.9,
    "median_tvl": 583.0,
    "p10_tvl": 515.0,
    "p90_tvl": 702.0
  },
  {
    "bucket": "$750M-1B",
    "n": 3968,
    "pct": 4.0,
    "median_tvl": 834.0,
    "p10_tvl": 763.0,
    "p90_tvl": 952.0
  },
  {
    "bucket": ">$1B",
    "n": 1450,
    "pct": 1.5,
    "median_tvl": 1130.0,
    "p10_tvl": 1018.0,
    "p90_tvl": 1469.0
  }
];

        const categories = rawData.map(d => d.bucket);
        const percentages = rawData.map(d => d.pct);
        const medianTvl = rawData.map(d => d.median_tvl);

        Highcharts.chart('chart', {
            chart: {
                type: 'column',
                backgroundColor: '#ffffff'
            },
            title: {
                text: 'Simulation Outcomes by TVL Bucket',
                style: { fontSize: '1.5rem', fontWeight: 'bold', color: '#333' }
            },
            subtitle: {
                text: 'Percentage of 100,000 simulations reaching each TVL level',
                style: { fontSize: '1rem', color: '#666' }
            },
            xAxis: {
                categories: categories,
                title: { text: 'Ending TVL Bucket', style: { fontSize: '1rem' } },
                labels: { style: { fontSize: '0.875rem' } }
            },
            yAxis: [{
                title: { text: '% of Simulations', style: { fontSize: '1rem' } },
                labels: { format: '{value}%', style: { fontSize: '0.875rem' } }
            }, {
                title: { text: 'Median TVL ($M)', style: { fontSize: '1rem' } },
                labels: { format: '${value}M', style: { fontSize: '0.875rem' } },
                opposite: true
            }],
            tooltip: {
                shared: true,
                useHTML: true
            },
            plotOptions: {
                column: {
                    dataLabels: {
                        enabled: true,
                        format: '{y:.1f}%'
                    }
                }
            },
            series: [{
                name: '% of Simulations',
                type: 'column',
                data: percentages,
                color: '#ADD8E6',
                tooltip: { valueSuffix: '%' }
            }, {
                name: 'Median TVL',
                type: 'spline',
                yAxis: 1,
                data: medianTvl,
                color: '#00008B',
                marker: { radius: 5 },
                tooltip: { valuePrefix: '$', valueSuffix: 'M' }
            }],
            legend: { enabled: true, align: 'center', verticalAlign: 'top' },
            credits: { text: 'Revenue-TVL Study', style: { fontSize: '0.75rem' } }
        });
    </script>
</body>
</html>
