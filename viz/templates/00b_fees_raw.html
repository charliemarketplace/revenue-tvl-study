<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Fees Over Time - Arbitrum vs Base</title>
    <script src="https://code.highcharts.com/highcharts.js"></script>
    <script src="https://code.highcharts.com/modules/exporting.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
            background-color: #f5f5f5;
        }
        #chart-container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        #chart { width: 100%; height: 500px; }
    </style>
</head>
<body>
    <div id="chart-container">
        <div id="chart"></div>
    </div>

    <script>
        const rawData = {{PLACEHOLDER}};

        // Group by chain
        const seriesData = {};
        rawData.forEach(row => {
            if (row.fees_eth === null) return;
            const chain = row.chain;
            if (!seriesData[chain]) seriesData[chain] = [];
            seriesData[chain].push([
                new Date(row.date).getTime(),
                row.fees_eth
            ]);
        });

        const colors = {
            'arbitrum': '#ADD8E6',
            'base': '#00008B'
        };

        const series = Object.keys(seriesData).map(chain => ({
            name: chain.charAt(0).toUpperCase() + chain.slice(1),
            data: seriesData[chain],
            color: colors[chain]
        }));

        Highcharts.chart('chart', {
            chart: {
                type: 'line',
                zoomType: 'xy',
                panning: { enabled: true, type: 'xy' },
                panKey: 'shift',
                backgroundColor: '#ffffff'
            },
            title: {
                text: 'Daily Sequencer Fees',
                style: { fontSize: '1.5rem', fontWeight: 'bold', color: '#333' }
            },
            subtitle: {
                text: 'Arbitrum vs Base - 2025',
                style: { fontSize: '1rem', color: '#666' }
            },
            xAxis: {
                type: 'datetime',
                title: { text: 'Date', style: { fontSize: '1rem' } },
                labels: { format: '{value:%b %e}', style: { fontSize: '0.875rem' } }
            },
            yAxis: {
                title: { text: 'Daily Fees (ETH)', style: { fontSize: '1rem' } },
                labels: { format: '{value:.0f} ETH', style: { fontSize: '0.875rem' } }
            },
            tooltip: {
                shared: true,
                useHTML: true,
                headerFormat: '<b>{point.x:%b %e, %Y}</b><br/>',
                pointFormat: '<span style="color:{series.color}">\u25CF</span> {series.name}: <b>{point.y:.2f} ETH</b><br/>'
            },
            legend: { enabled: true, align: 'center', verticalAlign: 'top' },
            plotOptions: {
                line: { marker: { enabled: false }, lineWidth: 2 }
            },
            series: series,
            credits: { text: 'Revenue-TVL Study', style: { fontSize: '0.75rem' } }
        });
    </script>
</body>
</html>
