<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction Count vs Fees</title>
    <script src="https://code.highcharts.com/highcharts.js"></script>
    <script src="https://code.highcharts.com/modules/exporting.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
            background-color: #f5f5f5;
        }
        #chart-container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        #chart { width: 100%; height: 500px; }
    </style>
</head>
<body>
    <div id="chart-container">
        <div id="chart"></div>
    </div>

    <script>
        const rawData = {{PLACEHOLDER}};

        const colors = {
            'arbitrum': '#ADD8E6',
            'base': '#00008B'
        };

        // Group by chain
        const seriesData = {};
        rawData.forEach(row => {
            const chain = row.chain;
            if (!seriesData[chain]) seriesData[chain] = [];
            seriesData[chain].push({
                x: row.d_log_n_tx,
                y: row.d_log_fees,
                date: row.date
            });
        });

        const series = Object.keys(seriesData).map(chain => ({
            name: chain.charAt(0).toUpperCase() + chain.slice(1),
            data: seriesData[chain],
            color: colors[chain]
        }));

        Highcharts.chart('chart', {
            chart: {
                type: 'scatter',
                zoomType: 'xy',
                backgroundColor: '#ffffff'
            },
            title: {
                text: 'Transaction Count vs Fee Changes',
                style: { fontSize: '1.5rem', fontWeight: 'bold', color: '#333' }
            },
            subtitle: {
                text: 'd_log(n_tx) vs d_log(fees) | Coefficient: 1.83 (p<0.001)',
                style: { fontSize: '1rem', color: '#666' }
            },
            xAxis: {
                title: { text: 'd_log(Transaction Count)', style: { fontSize: '1rem' } },
                labels: { format: '{value:.2f}', style: { fontSize: '0.875rem' } },
                plotLines: [{ value: 0, color: '#999', width: 1, dashStyle: 'Dash' }]
            },
            yAxis: {
                title: { text: 'd_log(Fees)', style: { fontSize: '1rem' } },
                labels: { format: '{value:.2f}', style: { fontSize: '0.875rem' } },
                plotLines: [{ value: 0, color: '#999', width: 1, dashStyle: 'Dash' }]
            },
            tooltip: {
                useHTML: true,
                headerFormat: '',
                pointFormat: '<b>{series.name}</b><br/>Date: {point.date}<br/>d_log(n_tx): {point.x:.4f}<br/>d_log(fees): {point.y:.4f}'
            },
            legend: { enabled: true, align: 'center', verticalAlign: 'top' },
            plotOptions: {
                scatter: {
                    marker: { radius: 4, opacity: 0.6 }
                }
            },
            series: series,
            credits: { text: 'Revenue-TVL Study', style: { fontSize: '0.75rem' } }
        });
    </script>
</body>
</html>
