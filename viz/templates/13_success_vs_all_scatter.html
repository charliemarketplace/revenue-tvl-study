<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TVL vs ETH DEX Volume Growth</title>
    <script src="https://code.highcharts.com/highcharts.js"></script>
    <script src="https://code.highcharts.com/modules/exporting.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
            background-color: #f5f5f5;
        }
        #chart-container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        #chart { width: 100%; height: 600px; }
    </style>
</head>
<body>
    <div id="chart-container">
        <div id="chart"></div>
    </div>

    <script>
        const rawData = {{PLACEHOLDER}};

        // Split by success threshold
        const belowThreshold = rawData.filter(d => !d.reached_750m).map(d => ({
            x: d.cum_d_log_dex_vol_eth,
            y: d.ending_tvl_m,
            fees: d.cumulative_fees
        }));

        const aboveThreshold = rawData.filter(d => d.reached_750m).map(d => ({
            x: d.cum_d_log_dex_vol_eth,
            y: d.ending_tvl_m,
            fees: d.cumulative_fees
        }));

        Highcharts.chart('chart', {
            chart: {
                type: 'scatter',
                zoomType: 'xy',
                backgroundColor: '#ffffff'
            },
            title: {
                text: 'Ending TVL vs Cumulative ETH DEX Volume Change',
                style: { fontSize: '1.5rem', fontWeight: 'bold', color: '#333' }
            },
            subtitle: {
                text: '5,000 sampled simulations | Shows correlation between DEX growth and TVL outcomes',
                style: { fontSize: '1rem', color: '#666' }
            },
            xAxis: {
                title: { text: 'Cumulative d_log(ETH DEX Volume)', style: { fontSize: '1rem' } },
                labels: { style: { fontSize: '0.875rem' } },
                plotLines: [{ value: 0, color: '#999', width: 1, dashStyle: 'Dash', label: { text: 'No change', style: { color: '#666' } } }]
            },
            yAxis: {
                title: { text: 'Ending TVL ($M)', style: { fontSize: '1rem' } },
                labels: { format: '${value}M', style: { fontSize: '0.875rem' } },
                plotLines: [{ value: 750, color: '#00008B', width: 2, dashStyle: 'Dash', label: { text: '$750M threshold', style: { color: '#00008B', fontWeight: 'bold' } } }]
            },
            tooltip: {
                useHTML: true,
                headerFormat: '',
                pointFormat: 'Ending TVL: <b>${point.y:.0f}M</b><br/>ETH DEX change: <b>{point.x:.2f}</b> log<br/>Annual fees: <b>{point.fees:.0f} ETH</b>'
            },
            legend: { enabled: true, align: 'center', verticalAlign: 'top' },
            plotOptions: {
                scatter: {
                    marker: { radius: 3, opacity: 0.5 }
                }
            },
            series: [{
                name: 'Below $750M',
                data: belowThreshold,
                color: '#ADD8E6'
            }, {
                name: 'Reached $750M+',
                data: aboveThreshold,
                color: '#00008B',
                marker: { radius: 5, opacity: 0.8 }
            }],
            credits: { text: 'Revenue-TVL Study', style: { fontSize: '0.75rem' } }
        });
    </script>
</body>
</html>
