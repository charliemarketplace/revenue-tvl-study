<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feature Importance (Incremental R-squared)</title>
    <script src="https://code.highcharts.com/highcharts.js"></script>
    <script src="https://code.highcharts.com/modules/exporting.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
            background-color: #f5f5f5;
        }
        #chart-container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        #chart { width: 100%; height: 500px; }
    </style>
</head>
<body>
    <div id="chart-container">
        <div id="chart"></div>
    </div>

    <script>
        const rawData = {{PLACEHOLDER}};

        // Sort by R2
        const sorted = rawData.sort((a, b) => b.r2 - a.r2);

        const categories = sorted.map(d => d.feature);
        const r2Values = sorted.map(d => d.r2 * 100); // Convert to percentage

        Highcharts.chart('chart', {
            chart: {
                type: 'bar',
                backgroundColor: '#ffffff'
            },
            title: {
                text: 'Feature Importance (Incremental R-squared)',
                style: { fontSize: '1.5rem', fontWeight: 'bold', color: '#333' }
            },
            subtitle: {
                text: 'R-squared when each feature is the only predictor | Higher = more explanatory power alone',
                style: { fontSize: '1rem', color: '#666' }
            },
            xAxis: {
                categories: categories,
                title: { text: null },
                labels: { style: { fontSize: '0.875rem' } }
            },
            yAxis: {
                title: { text: 'R-squared (%)', style: { fontSize: '1rem' } },
                labels: { format: '{value}%', style: { fontSize: '0.875rem' } },
                max: 60
            },
            tooltip: {
                useHTML: true,
                formatter: function() {
                    return '<b>' + this.x + '</b><br/>' +
                        'R-squared: ' + this.y.toFixed(1) + '%';
                }
            },
            plotOptions: {
                bar: {
                    dataLabels: {
                        enabled: true,
                        format: '{y:.1f}%'
                    },
                    colorByPoint: true,
                    colors: ['#00008B', '#1E3A8A', '#3B5998', '#5A7ABE', '#7A9BD4', '#9ABCEA', '#ADD8E6']
                }
            },
            series: [{
                name: 'R-squared',
                data: r2Values
            }],
            legend: { enabled: false },
            credits: { text: 'Revenue-TVL Study', style: { fontSize: '0.75rem' } }
        });
    </script>
</body>
</html>
