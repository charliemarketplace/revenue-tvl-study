<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sample Paths Reaching $500M+ TVL</title>
    <script src="https://code.highcharts.com/highcharts.js"></script>
    <script src="https://code.highcharts.com/modules/exporting.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
            background-color: #f5f5f5;
        }
        #chart-container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        #chart { width: 100%; height: 500px; }
    </style>
</head>
<body>
    <div id="chart-container">
        <div id="chart"></div>
    </div>

    <script>
        const rawData = {{PLACEHOLDER}};

        const bucketColors = {
            '$500-750M': '#ADD8E6',
            '$750M-1B': '#5A7ABE',
            '>$1B': '#00008B'
        };

        // Group by bucket for series
        const seriesData = {};
        rawData.forEach(row => {
            const bucket = row.tvl_bucket;
            if (!seriesData[bucket]) seriesData[bucket] = [];
            seriesData[bucket].push({
                x: row.ending_tvl_m,
                y: row.cumulative_fees,
                sim_id: row.sim_id
            });
        });

        const series = Object.keys(seriesData).map(bucket => ({
            name: bucket,
            data: seriesData[bucket],
            color: bucketColors[bucket] || '#999'
        }));

        Highcharts.chart('chart', {
            chart: {
                type: 'scatter',
                zoomType: 'xy',
                backgroundColor: '#ffffff'
            },
            title: {
                text: 'Simulations Reaching $500M+ TVL',
                style: { fontSize: '1.5rem', fontWeight: 'bold', color: '#333' }
            },
            subtitle: {
                text: 'Sample of 50 paths from 100,000 simulations | Shows ending TVL vs annual fees',
                style: { fontSize: '1rem', color: '#666' }
            },
            xAxis: {
                title: { text: 'Ending TVL ($M)', style: { fontSize: '1rem' } },
                labels: { format: '${value}M', style: { fontSize: '0.875rem' } }
            },
            yAxis: {
                title: { text: 'Cumulative Annual Fees (ETH)', style: { fontSize: '1rem' } },
                labels: { style: { fontSize: '0.875rem' } }
            },
            tooltip: {
                useHTML: true,
                headerFormat: '',
                pointFormat: '<b>Simulation #{point.sim_id}</b><br/>' +
                    'Ending TVL: ${point.x:.0f}M<br/>' +
                    'Annual Fees: {point.y:.1f} ETH'
            },
            legend: { enabled: true, align: 'center', verticalAlign: 'top' },
            plotOptions: {
                scatter: {
                    marker: { radius: 6, opacity: 0.7 }
                }
            },
            series: series,
            credits: { text: 'Revenue-TVL Study', style: { fontSize: '0.75rem' } }
        });
    </script>
</body>
</html>
