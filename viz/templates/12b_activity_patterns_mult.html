<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity Growth: Successful vs All Paths</title>
    <script src="https://code.highcharts.com/highcharts.js"></script>
    <script src="https://code.highcharts.com/modules/exporting.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
            background-color: #f5f5f5;
        }
        #chart-container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        #chart { width: 100%; height: 500px; }
        .insight {
            margin-top: 20px;
            padding: 15px;
            background: #f0f7ff;
            border-left: 4px solid #00008B;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>
    <div id="chart-container">
        <div id="chart"></div>
        <div class="insight">
            <strong>Key Insight:</strong> The average path has <em>shrinking</em> DEX volume (0.52x for ETH).
            Paths reaching $750M+ show sustained growth (~1.8x). Reaching high TVL requires reversing the typical contraction trend.
        </div>
    </div>

    <script>
        const rawData = {{PLACEHOLDER}};

        const categories = rawData.map(d => d.Metric);
        const successData = rawData.map(d => d.Success_Mult);
        const allData = rawData.map(d => d.All_Mult);

        Highcharts.chart('chart', {
            chart: {
                type: 'bar',
                backgroundColor: '#ffffff'
            },
            title: {
                text: 'Activity Growth Multipliers: $750M+ Paths vs All Paths',
                style: { fontSize: '1.5rem', fontWeight: 'bold', color: '#333' }
            },
            subtitle: {
                text: 'Cumulative growth over 365-day simulation | 1.0x = no change, <1.0x = shrinkage, >1.0x = growth',
                style: { fontSize: '1rem', color: '#666' }
            },
            xAxis: {
                categories: categories,
                title: { text: null },
                labels: { style: { fontSize: '0.95rem' } }
            },
            yAxis: {
                title: { text: 'Growth Multiple', style: { fontSize: '1rem' } },
                labels: {
                    format: '{value}x',
                    style: { fontSize: '0.875rem' }
                },
                min: 0,
                max: 3.5
            },
            tooltip: {
                shared: true,
                useHTML: true,
                formatter: function() {
                    let html = '<b>' + this.x + '</b><br/>';
                    this.points.forEach(point => {
                        const status = point.y >= 1 ? 'growth' : 'shrinkage';
                        const pct = ((point.y - 1) * 100).toFixed(0);
                        const sign = point.y >= 1 ? '+' : '';
                        html += '<span style="color:' + point.color + '">\u25CF</span> ' +
                            point.series.name + ': <b>' + point.y.toFixed(2) + 'x</b> (' + sign + pct + '%)<br/>';
                    });
                    return html;
                }
            },
            plotOptions: {
                bar: {
                    dataLabels: {
                        enabled: true,
                        format: '{y:.2f}x',
                        style: { fontWeight: 'bold' }
                    },
                    groupPadding: 0.1
                }
            },
            series: [{
                name: 'Paths -> $750M+',
                data: successData,
                color: '#00008B'
            }, {
                name: 'All Paths (median)',
                data: allData,
                color: '#ADD8E6'
            }],
            legend: { enabled: true, align: 'center', verticalAlign: 'top' },
            credits: { text: 'Revenue-TVL Study | 100k Monte Carlo simulations', style: { fontSize: '0.75rem' } }
        });
    </script>
</body>
</html>
