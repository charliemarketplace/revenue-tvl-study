<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity Patterns: Successful vs All Paths</title>
    <script src="https://code.highcharts.com/highcharts.js"></script>
    <script src="https://code.highcharts.com/modules/exporting.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
            background-color: #f5f5f5;
        }
        #chart-container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        #chart { width: 100%; height: 500px; }
    </style>
</head>
<body>
    <div id="chart-container">
        <div id="chart"></div>
    </div>

    <script>
        const rawData = [
  {
    "Metric": "ETH DEX Volume",
    "Paths_750M+": 0.56,
    "All_Paths": -0.66,
    "Growth_Multiple": "~1.8x"
  },
  {
    "Metric": "Transaction Count",
    "Paths_750M+": 0.43,
    "All_Paths": 0.15,
    "Growth_Multiple": "~1.5x"
  },
  {
    "Metric": "BTC DEX Volume",
    "Paths_750M+": 0.7,
    "All_Paths": -0.18,
    "Growth_Multiple": "~2.0x"
  },
  {
    "Metric": "Stable DEX Volume",
    "Paths_750M+": 0.83,
    "All_Paths": -0.05,
    "Growth_Multiple": "~2.3x"
  },
  {
    "Metric": "TVL",
    "Paths_750M+": 1.1,
    "All_Paths": 0.17,
    "Growth_Multiple": "~3.0x"
  }
];

        // Prepare data for grouped bar chart
        const categories = rawData.map(d => d.Metric);

        // Parse the Paths_750M+ and All_Paths values
        const successData = rawData.map(d => d["Paths_750M+"]);
        const allData = rawData.map(d => d["All_Paths"]);

        Highcharts.chart('chart', {
            chart: {
                type: 'bar',
                backgroundColor: '#ffffff'
            },
            title: {
                text: 'Activity Patterns: Paths Reaching $750M+ vs All Paths',
                style: { fontSize: '1.5rem', fontWeight: 'bold', color: '#333' }
            },
            subtitle: {
                text: 'Cumulative log changes over 365-day simulation | Positive = growth, Negative = shrinkage',
                style: { fontSize: '1rem', color: '#666' }
            },
            xAxis: {
                categories: categories,
                title: { text: null },
                labels: { style: { fontSize: '0.9rem' } }
            },
            yAxis: {
                title: { text: 'Cumulative Log Change', style: { fontSize: '1rem' } },
                labels: { style: { fontSize: '0.875rem' } },
                plotLines: [{ value: 0, color: '#999', width: 2, dashStyle: 'Solid' }]
            },
            tooltip: {
                shared: true,
                useHTML: true,
                formatter: function() {
                    let html = '<b>' + this.x + '</b><br/>';
                    this.points.forEach(point => {
                        const mult = Math.exp(point.y).toFixed(2);
                        const dir = point.y >= 0 ? 'growth' : 'shrinkage';
                        html += '<span style="color:' + point.color + '">\u25CF</span> ' +
                            point.series.name + ': <b>' + point.y.toFixed(2) + '</b> log (' + mult + 'x ' + dir + ')<br/>';
                    });
                    return html;
                }
            },
            plotOptions: {
                bar: {
                    dataLabels: {
                        enabled: true,
                        formatter: function() {
                            const mult = Math.exp(this.y).toFixed(2);
                            return mult + 'x';
                        }
                    },
                    groupPadding: 0.1
                }
            },
            series: [{
                name: 'Paths -> $750M+',
                data: successData,
                color: '#00008B'
            }, {
                name: 'All Paths',
                data: allData,
                color: '#ADD8E6'
            }],
            legend: { enabled: true, align: 'center', verticalAlign: 'top' },
            credits: { text: 'Revenue-TVL Study', style: { fontSize: '0.75rem' } }
        });
    </script>
</body>
</html>
